services:
    upnp:
      restart: always
      network_mode: host  # works while the container runs
      build:
        context: upnpservice
        network: host  # works during the build if needed
    api:
      build:
        context: Server
      stop_signal: SIGINT
      ports:
        - '5000:5000'
    web:
      build:
        context: OilChangeApp
      ports:
        - '80:80'
